# Schema-safe deployment - Platform issue workaround
[deployment]
run = ["node", "deployment-schema-safe.js"]
deploymentTarget = "cloudrun"

[deployment.environment]
NODE_ENV = "production"
USE_EXISTING_SCHEMA = "true"
SKIP_MIGRATION_CHECKS = "true"
PRESERVE_DATABASE_STATE = "true"
DISABLE_PACKAGE_CACHE = "true"
NPM_CONFIG_CACHE = "false"
YARN_CACHE_FOLDER = "/tmp/yarn-cache"

# Build without migration dependencies
build = ["sh", "-c", "echo 'Schema-safe build: Using existing database schema' && npm run build"]

# Normal deployment with migrations enabled
[deployment.ignorePorts]
value = false
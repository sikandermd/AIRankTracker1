# Replit deployment configuration with complete migration bypass
[deployment]
run = ["node", "deploy-safe.js"]
deploymentTarget = "cloudrun"

[deployment.environment]
SKIP_MIGRATIONS = "true"
NODE_ENV = "production"
DRIZZLE_KIT_SKIP = "true"

# Build that completely bypasses migration system
build = ["sh", "-c", "echo 'Safe deployment: Migration system bypassed' && SKIP_MIGRATIONS=true npm run build"]

# Disable automatic migrations entirely
[deployment.ignorePorts]
value = false
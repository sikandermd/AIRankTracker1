# Normal deployment configuration - Migrations enabled + Cache optimized
[deployment]
run = ["node", "deployment-enhanced.js"]
deploymentTarget = "cloudrun"

[deployment.environment]
SKIP_ALL_MIGRATIONS = "false"
NODE_ENV = "production"
DRIZZLE_DISABLE = "false"
DATABASE_MIGRATIONS = "true"
DISABLE_PACKAGE_CACHE = "true"
NPM_CONFIG_CACHE = "false"
YARN_CACHE_FOLDER = "/tmp/yarn-cache"

# Build with normal database operations and cache bypass
build = ["sh", "-c", "echo 'Normal deployment with cache optimization' && DISABLE_PACKAGE_CACHE=true npm run build"]

# Normal deployment with migrations enabled
[deployment.ignorePorts]
value = false
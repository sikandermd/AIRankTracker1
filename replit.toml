# Alternative deployment configuration - No migrations
[deployment]
run = ["node", "alternative-deploy.js"]
deploymentTarget = "cloudrun"

[deployment.environment]
SKIP_ALL_MIGRATIONS = "true"
NODE_ENV = "production"
DRIZZLE_DISABLE = "true"
DATABASE_MIGRATIONS = "false"

# Build without any database operations
build = ["sh", "-c", "echo 'No-migration build starting...' && npm run build"]

# Completely disable migration system
[deployment.ignorePorts]
value = false